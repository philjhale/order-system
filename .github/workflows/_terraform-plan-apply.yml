name: (reusable) Terraform plan/apply

on:
  workflow_call:
    inputs:
      working-directory:
        description: Terraform root module to run against, relative to repo root.
        required: true
        type: string
      mode:
        description: '"plan" (PR runs) or "apply" (post-merge runs on main).'
        required: true
        type: string
      tf-vars:
        description: >-
          Extra `-var` arguments appended verbatim to plan/apply, e.g.
          "-var image_tag=abc123". Optional — most working directories (e.g.
          shared/) declare no variables.
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    # azurerm/azuread providers use ARM_USE_OIDC + the azure/login-issued federated token
    # rather than a client secret — no long-lived Azure credential is stored anywhere in
    # this repo or in secrets. Set at job level since every terraform step below needs it.
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      # -lock-timeout=5m on both plan and apply below: a PR's plan and a merge's apply can
      # land on the same stack's state within seconds of each other and briefly collide on
      # the state lock. Without this, whichever one loses the race fails outright instead
      # of just waiting the few seconds it takes for the other to finish and release it.
      - name: Terraform plan
        if: inputs.mode == 'plan'
        run: terraform plan -input=false -lock-timeout=5m ${{ inputs.tf-vars }}

      - name: Terraform apply
        if: inputs.mode == 'apply'
        run: terraform apply -input=false -auto-approve -lock-timeout=5m ${{ inputs.tf-vars }}
