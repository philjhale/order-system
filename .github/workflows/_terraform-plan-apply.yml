name: (reusable) Terraform plan/apply

on:
  workflow_call:
    inputs:
      working-directory:
        description: Terraform root module to run against, relative to repo root.
        required: true
        type: string
      stack-name:
        description: >-
          Short unique id for this root module (e.g. "shared", "order-service").
          Used as the plan-artifact name and the stack label in the PR plan report.
        required: true
        type: string
      mode:
        description: '"plan" (PR runs) or "apply" (post-merge runs on main).'
        required: true
        type: string
      tf-vars:
        description: >-
          Extra `-var` arguments appended verbatim to plan/apply, e.g.
          "-var image_tag=abc123". Optional — most working directories (e.g.
          shared/) declare no variables.
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    # azurerm/azuread providers use ARM_USE_OIDC + the azure/login-issued federated token
    # rather than a client secret — no long-lived Azure credential is stored anywhere in
    # this repo or in secrets. Set at job level since every terraform step below needs it.
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init

      - name: Terraform validate
        run: terraform validate

      # `set -e` (bash's default for run: steps) plus pipefail means a failing `terraform
      # plan` still stops this step right after tee has written plan.txt but before the
      # `terraform show` line runs — plan.json just won't exist. The metadata/upload steps
      # below run on `always()` so the report action still gets the error output.
      - name: Terraform plan
        if: inputs.mode == 'plan'
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out plan.tfplan ${{ inputs.tf-vars }} 2>&1 | tee plan.txt
          terraform show -json plan.tfplan > plan.json

      - name: Write plan metadata
        if: always() && inputs.mode == 'plan'
        run: |
          jq -n --arg stack "${{ inputs.stack-name }}" '{ stack: $stack }' > meta.json

      - name: Upload plan artifact
        if: always() && inputs.mode == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tf-plan-${{ inputs.stack-name }}
          path: |
            ${{ inputs.working-directory }}/plan.txt
            ${{ inputs.working-directory }}/plan.json
            ${{ inputs.working-directory }}/meta.json

      - name: Terraform apply
        if: inputs.mode == 'apply'
        run: terraform apply -input=false -auto-approve ${{ inputs.tf-vars }}
