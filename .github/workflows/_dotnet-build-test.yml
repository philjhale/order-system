name: (reusable) .NET build + test

on:
  workflow_call:
    inputs:
      solution-path:
        description: Path to the .sln file to build/test, relative to repo root.
        required: true
        type: string

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "${{ inputs.solution-path }}"

      - name: Build
        run: dotnet build "${{ inputs.solution-path }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ inputs.solution-path }}" --configuration Release --no-build
