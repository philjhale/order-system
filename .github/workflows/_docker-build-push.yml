name: (reusable) Docker build + push

on:
  workflow_call:
    inputs:
      service-name:
        description: Service folder name under services/, also used as the ACR repository name.
        required: true
        type: string
      dockerfile-path:
        description: Path to the service's Dockerfile, relative to repo root.
        required: true
        type: string
      context-path:
        description: Docker build context, relative to repo root.
        required: true
        type: string
      image-tag:
        description: >-
          Content-based tag for this build (e.g. the last commit that touched the service's
          inputs), not github.sha — keeps the tag, and anything keyed on it (terraform diffs,
          redeploys), stable across commits that don't actually change this image.
        required: true
        type: string
      registry-name:
        description: Shared ACR registry name (not the login server), e.g. acrordersystem01.
        required: true
        type: string
      push:
        description: >-
          If false, builds only (validates the Dockerfile) without pushing —
          use for PR runs, so an unmerged/untested image never reaches the
          registry or overwrites the mutable :latest tag.
        required: true
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        if: inputs.push
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        if: inputs.push
        run: az acr login --name "${{ inputs.registry-name }}"

      - name: Build
        env:
          LOGIN_SERVER: ${{ inputs.registry-name }}.azurecr.io
        run: |
          docker build \
            -f "${{ inputs.dockerfile-path }}" \
            -t "$LOGIN_SERVER/${{ inputs.service-name }}:${{ inputs.image-tag }}" \
            -t "$LOGIN_SERVER/${{ inputs.service-name }}:latest" \
            "${{ inputs.context-path }}"

      - name: Push
        if: inputs.push
        env:
          LOGIN_SERVER: ${{ inputs.registry-name }}.azurecr.io
        run: |
          docker push "$LOGIN_SERVER/${{ inputs.service-name }}:${{ inputs.image-tag }}"
          docker push "$LOGIN_SERVER/${{ inputs.service-name }}:latest"
