name: CI

on:
  pull_request:
  push:
    branches: [main]

# A reusable workflow's own `permissions:` block can only narrow what its
# caller grants it, never add to it — id-token is never part of the
# GITHUB_TOKEN default permission set, so without this every azure/login
# step inside the called workflows below would fail to mint an OIDC token.
permissions:
  id-token: write
  contents: read

jobs:
  # Detects which service folders a PR/push touches. A shared/**, root-config, or CI workflow
  # change is treated as affecting every service (not none): shared/ is referenced by every
  # service via relative-path project reference, and .github/workflows/** controls every
  # service's build/deploy logic directly — either would otherwise merge with the affected
  # service's build/deploy silently skipped.
  changes:
    runs-on: ubuntu-latest
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      order-service: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.order-service-only == 'true' }}
      inventory-service: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.inventory-service-only == 'true' }}
      payment-service: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.payment-service-only == 'true' }}
      fulfillment-service: ${{ steps.filter.outputs.shared == 'true' || steps.filter.outputs.fulfillment-service-only == 'true' }}
      # Content-based, not github.sha: github.sha changes on every commit, so a build/deploy
      # keyed on it treats a CI-workflow-only or other unrelated-to-this-service commit as a new
      # image, producing a phantom terraform diff (plan) or a bit-identical redeploy (apply) even
      # though nothing this service's image actually depends on changed. Keying on the last commit
      # that touched the service's own inputs makes the tag — and therefore the terraform diff —
      # change only when the built image's content actually would.
      order-service-image-tag: ${{ steps.tag.outputs.order-service }}
    steps:
      # paths-filter needs full history to diff push events against
      # github.event.before; a shallow (default depth-1) checkout can't.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'shared/**'
              - 'Directory.Build.props'
              - '.editorconfig'
              - '.github/workflows/**'
            order-service-only:
              - 'services/order-service/**'
            inventory-service-only:
              - 'services/inventory-service/**'
            payment-service-only:
              - 'services/payment-service/**'
            fulfillment-service-only:
              - 'services/fulfillment-service/**'

      # One tag per service, derived from the paths that actually feed its Docker image —
      # its own folder plus the shared/ code and root build config it references. `git log -1`
      # against those paths (not `git rev-parse HEAD`) is what makes this content-based rather
      # than commit-based: it only advances when one of those paths' content actually changed.
      - name: Compute content-based image tags
        id: tag
        run: |
          echo "order-service=$(git log -1 --format=%H -- services/order-service shared Directory.Build.props)" >> "$GITHUB_OUTPUT"

  shared-build-test:
    uses: ./.github/workflows/_dotnet-build-test.yml
    with:
      solution-path: shared/OrderSystem.Shared.sln

  terraform-shared:
    uses: ./.github/workflows/_terraform-plan-apply.yml
    with:
      working-directory: infra/terraform/shared
      mode: ${{ github.event_name == 'pull_request' && 'plan' || 'apply' }}

  order-service-build-test:
    needs: changes
    if: needs.changes.outputs.order-service == 'true'
    uses: ./.github/workflows/_dotnet-build-test.yml
    with:
      solution-path: services/order-service/OrderSystem.OrderService.sln

  inventory-service-build-test:
    needs: changes
    if: needs.changes.outputs.inventory-service == 'true'
    uses: ./.github/workflows/_dotnet-build-test.yml
    with:
      solution-path: services/inventory-service/OrderSystem.InventoryService.sln

  payment-service-build-test:
    needs: changes
    if: needs.changes.outputs.payment-service == 'true'
    uses: ./.github/workflows/_dotnet-build-test.yml
    with:
      solution-path: services/payment-service/OrderSystem.PaymentService.sln

  fulfillment-service-build-test:
    needs: changes
    if: needs.changes.outputs.fulfillment-service == 'true'
    uses: ./.github/workflows/_dotnet-build-test.yml
    with:
      solution-path: services/fulfillment-service/OrderSystem.FulfillmentService.sln

  order-service-docker:
    needs: [changes, order-service-build-test]
    if: needs.changes.outputs.order-service == 'true'
    uses: ./.github/workflows/_docker-build-push.yml
    with:
      service-name: order-service
      dockerfile-path: services/order-service/Dockerfile
      context-path: .
      registry-name: acrordersystem01
      image-tag: ${{ needs.changes.outputs.order-service-image-tag }}
      push: ${{ github.event_name != 'pull_request' }}

  # PR runs only get a plan (no image has been pushed yet to actually deploy) — the real
  # apply + migration-job dance lives in order-service-deploy below, post-merge only.
  order-service-terraform-plan:
    needs: changes
    if: needs.changes.outputs.order-service == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/_terraform-plan-apply.yml
    with:
      working-directory: services/order-service/infra/terraform
      mode: plan
      tf-vars: -var image_tag=${{ needs.changes.outputs.order-service-image-tag }}

  # Not expressed as a call into _terraform-plan-apply.yml: unlike shared/, this apply has to be
  # staged in two passes around the migration job, which the generic reusable workflow doesn't
  # (yet) support. Revisit folding this into a shared template once a second service with its own
  # database needs the identical dance.
  order-service-deploy:
    needs: [changes, order-service-build-test, terraform-shared, order-service-docker]
    if: needs.changes.outputs.order-service == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/order-service/infra/terraform
    permissions:
      id-token: write
      contents: read
    # azurerm provider uses ARM_USE_OIDC + the azure/login-issued federated token rather than
    # a client secret. Set at job level since every terraform step below needs it.
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform init
        run: terraform init

      # Updates only the migration job's image first, so the migration below runs against the
      # *new* image's EF Core migrations before the Container App (updated in the second apply)
      # starts serving that same image's code against a not-yet-migrated schema.
      #
      # The firewall rule is targeted explicitly too — it isn't a dependency of the container app
      # job resource (Terraform only pulls in a target's own dependencies), so without listing it
      # here the migration container has no network path to the SQL server at all and fails with
      # "Client with IP address ... is not allowed to access the server."
      #
      # -lock-timeout=5m on both applies below: a PR's order-service-terraform-plan can land on
      # this same stack's state within seconds of a merge's apply and briefly hold the lock.
      # Without this, whichever one loses that race fails outright instead of waiting the few
      # seconds it takes for the other to finish and release it.
      - name: Terraform apply (migration job only)
        run: terraform apply -input=false -auto-approve -lock-timeout=5m -target=azurerm_container_app_job.order_service_migrate -target=azurerm_mssql_firewall_rule.allow_azure_services -var "image_tag=${{ needs.changes.outputs.order-service-image-tag }}"

      # Re-authenticate right before fetching the SQL token: the targeted apply above can take
      # long enough (real cross-region SQL server/database provisioning, not just a fast
      # rejection) that the GitHub OIDC assertion from the job's first azure/login step has
      # expired (its own validity window is ~5 minutes) by the time `az account get-access-token`
      # needs to exchange it for a new resource scope, failing with AADSTS700024.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # A one-shot job run isn't covered by the application-level EnableRetryOnFailure() and
      # can hit a freshly-idle Serverless DB's resume window, hence the retry/wait loop here
      # rather than a single `job start` call.
      - name: Run migration job and wait for completion
        run: |
          set -euo pipefail
          SQL_TOKEN=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)
          echo "::add-mask::$SQL_TOKEN"

          # `job start --env-vars` replaces the container's whole env list rather than merging
          # into it, so every var the targeted apply above just set on the job template has to
          # be resupplied here too, not just the token — otherwise the migration job runs with
          # ConnectionStrings__OrderDb etc. missing and fails immediately. Read from Terraform
          # outputs rather than hardcoded, so these can't drift from the actual resource names.
          SQL_SERVER_FQDN=$(terraform output -raw sql_server_fqdn)
          SQL_DATABASE_NAME=$(terraform output -raw sql_database_name)
          IDENTITY_CLIENT_ID=$(terraform output -raw managed_identity_client_id)
          IDENTITY_NAME=$(terraform output -raw managed_identity_name)
          IMAGE=$(terraform output -raw image)
          CONNECTION_STRING="Server=tcp:${SQL_SERVER_FQDN},1433;Database=${SQL_DATABASE_NAME};Authentication=Active Directory Managed Identity;User Id=${IDENTITY_CLIENT_ID};Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

          # `--env-vars` makes the CLI build a full container override rather than patching just
          # the env list, so both `--image` and `--command` must be resupplied too — omitting
          # `--image` fails outright with "(ContainerAppImageRequired) Container ... must have an
          # 'Image' property specified", but omitting `--command` fails silently: the execution
          # starts, drops back to the image's default entrypoint (the web server, not `migrate`),
          # and then just runs forever since the web server never exits, until the wait loop below
          # times out. The job template's own `command` (Terraform) is never consulted by `job
          # start`'s override.
          EXECUTION=$(az containerapp job start \
            --name caj-order-service-migrate \
            --resource-group rg-order-system \
            --image "$IMAGE" \
            --command "dotnet" "OrderSystem.OrderService.dll" "migrate" \
            --env-vars \
              "ConnectionStrings__OrderDb=$CONNECTION_STRING" \
              "Sql__ServerFqdn=$SQL_SERVER_FQDN" \
              "Sql__DatabaseName=$SQL_DATABASE_NAME" \
              "Sql__ManagedIdentityName=$IDENTITY_NAME" \
              "Sql__CiAccessToken=$SQL_TOKEN" \
            --query name -o tsv)

          for attempt in $(seq 1 30); do
            # A transient CLI/API error here (e.g. RBAC propagation delay right after the
            # targeted apply) shouldn't abort the whole wait loop under `set -e` — only an
            # actual Failed/timeout status should.
            STATUS=$(az containerapp job execution list \
              --name caj-order-service-migrate \
              --resource-group rg-order-system \
              --query "[?name=='$EXECUTION'].properties.status | [0]" -o tsv || echo "")
            echo "Migration job status: ${STATUS:-<query failed, retrying>}"
            case "$STATUS" in
              Succeeded) exit 0 ;;
              Failed) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for migration job execution"
          exit 1

      - name: Terraform apply (full)
        run: terraform apply -input=false -auto-approve -lock-timeout=5m -var "image_tag=${{ needs.changes.outputs.order-service-image-tag }}"

  # Docker build/push and per-service terraform plan/apply jobs are added
  # here, one set of `uses:`/job blocks per service, once that service
  # actually has a Dockerfile and infra/terraform/ to run against.
